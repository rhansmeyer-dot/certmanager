name: Supabase keep-alive

# Prevents the Supabase free-tier project from auto-pausing after ~7 days idle.
# Hits the API's /health/db endpoint, which runs `select 1` against the database —
# that DB activity resets the idle timer. Every 6h gives a huge safety margin.
# NOTE: update API_URL here if the API host changes (e.g. Railway -> Render).

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours (offset :17 to avoid the top-of-hour rush)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping DB keep-alive endpoint
        env:
          API_URL: https://certmanagerapi-production.up.railway.app
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$API_URL/health/db") || code=000
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then echo "keep-alive OK"; exit 0; fi
            sleep 30
          done
          echo "keep-alive failed after 3 attempts"
          exit 1
