# Render Blueprint — speak2 CertManager API (Node/Fastify)
# Frontend stays on Vercel; DB + document storage stay on Supabase (Frankfurt/EU).
# This hosts only the API. Free plan sleeps after ~15 min idle (cold start ~30-50s).
services:
  - type: web
    name: certmanager-api
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    rootDir: .
    buildCommand: npm install && npm run build -w apps/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://certmanager-speak2.vercel.app
      - key: SUPABASE_URL
        value: https://xmqkswidhxwrtyyycdzy.supabase.co
      # Secrets (set in Render dashboard or via API — never committed):
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PASSWORD_SALT
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: USER_HASH_thomas_AT_speak2_DOT_de
        sync: false
